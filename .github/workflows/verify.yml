name: Verify evidence and site

on:
  pull_request:
  push:
    branches: [main, 'arena/**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore the checksum-pinned shared template
        run: bash scripts/bootstrap_template.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Run fail-closed, raster and site tests
        run: python -m pytest -q
      - name: Verify generated site is committed
        run: git diff --exit-code -- docs
