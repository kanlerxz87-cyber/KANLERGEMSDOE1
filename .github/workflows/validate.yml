name: validate-research-evidence
on:
  pull_request:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit and scientific regression tests (no data downloads or slots)
        run: python -m unittest discover -s tests -v
      - name: Verify generated executive summary and pinned evidence hashes
        run: python scripts/build_executive_summary.py --check
