name: github-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify executive evidence before publication
        run: |
          python3 scripts/build_executive_summary.py --check
          python3 scripts/build_readiness_report.py --check
          python3 scripts/build_submit_page.py --check
      - name: Refresh the public leaderboard snapshot (fallback to dated snapshot)
        run: python3 scripts/refresh_public_feed.py --output docs/feed.json
      - name: Observe focus-source freshness (not scores or a complete registry)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/refresh_focus_sources.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
